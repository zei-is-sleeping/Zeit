name: zeit
description: time flies, but this image makes every second count

base-image: ghcr.io/bootcrew/arch-bootc
image-version: latest 

modules:
  - type: files
    files:
      - source: system
        destination: / 

  - type: script
    scripts:
      - preset-cachyos.sh

  - type: script
    secrets:
      - type: env
        name: NTFY_TOPIC
        mount:
          type: env
          name: NTFY_TOPIC
    snippets:
      - 'curl -s -d "CachyOS Preset installed!" -H "Title: Layer Complete" -H "Tags: hourglass" "ntfy.sh/$NTFY_TOPIC" || true'

  - type: script
    snippets:
      - 'echo "Base packages merged into preset-cachyos"'
    scripts:
      - setup-yay-user.sh
      - setup-v3-gaslight.sh

  - type: kargs
    kargs:
      - mitigations=off
      - nowatchdog
      - nvidia_drm.modeset=1
      - nvidia_drm.fbdev=1
      - split_lock_detect=off
      - i915.enable_guc=3

  - type: script
    scripts:
      - prepare-repository-packages.sh

  - type: pacman
    install:
      packages:
        # === Desktop & WM ===
        - hyprland
        - cliphist
        - wl-clipboard
        - hyprsunset
        - nwg-displays
        - xdg-desktop-portal-gtk
        - xdg-desktop-portal-hyprland
        - xdg-user-dirs
        - xdg-utils
        - adw-gtk-theme
        - papirus-icon-theme
        - cachyos-extra-v3/noctalia

        # === Lock Screen ===
        - sddm
        - qt6-declarative 
        - qt6-5compat 
        - qt6-svg
        - qt6-multimedia 
        - qt6-multimedia-ffmpeg
        - gst-plugins-base 
        - gst-plugins-good 
        - gst-plugins-bad 
        - gst-plugins-ugly

        # === Browsers ===
        - zen-browser-bin

        # === Audio Stack ===
        - pipewire
        - pipewire-pulse
        - pipewire-alsa
        - wireplumber
        - sof-firmware
        - pavucontrol
        - mpd
        - mpd-mpris
        - rmpc
        - mpv
        - mpv-mpris
        - ffmpeg
        - ffmpegthumbnailer
        - spotify
        - spicetify-cli
        - cava

        # === Fonts ===
        - apple-fonts
        - inter-font
        - noto-fonts
        - noto-fonts-cjk
        - noto-fonts-emoji
        - ttf-nerd-fonts-symbols
        - ttf-nerd-fonts-symbols-common

        # === Shell & Terminal ===
        - fish
        - fisher
        - atuin
        - zoxide
        - starship
        - kitty

        # === CLI Tools (AI + Personal) ===
        - ollama 
        - ollama-vulkan
        - ast-grep
        - dust
        - procs
        - jc
        - ripgrep-all
        - yt-dlp
        - tealdeer
        - trash-cli
        - ouch
        - trippy
        - httpie
        - bc
        - rsync
        - wget

        # === Dev Tools ===
        - github-cli
        - uv
        - libxcrypt-compat
        - ninja 
        - cmake 

        # === System Utils ===
        - btop
        - inxi
        - lshw
        - bind
        - smartmontools
        - btrfsmaintenance
        - fuse-overlayfs
        - fuse2
        - zram-generator
        - keyd
        - evtest
        - opentabletdriver
        - xorg-xhost
        - udiskie
        - gnome-keyring
        - libnotify
        - upower
        - power-profiles-daemon
        - resvg

        # === Networking ===
        - networkmanager
        - iwd
        - bluez
        - bluez-utils
        - blueman
        - tailscale

        # === GPU Drivers ===
        - nvidia-prime
        - lib32-nvidia-utils
        - vulkan-intel
        - vulkan-icd-loader
        - lib32-vulkan-icd-loader
        - intel-media-driver
        - intel-ucode
        - lib32-mesa
        - mangohud
        - lib32-mangohud

        # === Kernel & Power ===
        - cachyos-settings
        - nohang
        - thermald

        # === Gaming ===
        - steam
        - millennium
        - mgba-qt
        - emulationstation-de
        - flatpak

        # === Personal Apps ===
        - celluloid
        - vesktop
        - obsidian
        - aria2
        - freedownloadmanager
        - gdu
        - imv
        - opencode
        - koodo-reader-bin

        # === Sekai Pop === 
        - quickshell
        - qt6-multimedia-ffmpeg
        - qt6-imageformats
        - qt6-shadertools
        - ttf-material-symbols-variable
        - ttf-jetbrains-mono-nerd
        - grim
        - slurp
        - swappy 
        - wf-recorder
        - hyprpicker
        - wtype
        - imagemagick
        - tesseract
        - tesseract-data-eng
        - matugen
        - brightnessctl
        - ddcutil
        - qt6ct
        - zenity
        - python-numpy
        - libcanberra
        - sound-theme-freedesktop
        - nm-connection-editor
        - playerctl 
        - hypridle
        - pacman-contrib
        - xorg-xrdb
        - gvfs
        - thunar 
        - thunar-volman
        - tumbler 
        - songrec
        - mpvpaper 
        - cloudflare-warp-bin

  - type: script
    secrets:
      - type: env
        name: NTFY_TOPIC
        mount:
          type: env
          name: NTFY_TOPIC
    snippets:
      - 'curl -s -d "Repository packages installed!" -H "Title: Layer Complete" -H "Tags: hourglass" "ntfy.sh/$NTFY_TOPIC" || true'

  - type: script 
    scripts:
      - install-personal.sh 

  - type: script 
    secrets:
      - type: env
        name: NTFY_TOPIC
        mount:
          type: env
          name: NTFY_TOPIC
    snippets:
      - 'curl -s -d "AUR and personal packages installed!" -H "Title: Layer Complete" -H "Tags: hourglass" "ntfy.sh/$NTFY_TOPIC" || true'
    scripts:
      - cleanup-yay-user.sh

  - type: systemd 
    system: 
      enabled: 
        - bluetooth 
        - power-profiles-daemon 
        - sddm
        - NetworkManager
        - fstrim.timer
        - smartd
        - bootc-fetch-apply-updates.timer
        - systemd-resolved
        - keyd
        - thermald 
        - scx_loader
        - nohang-desktop
        - upower
        - warp-svc
      disabled:
        - systemd-networkd
    user:
      enabled:
        - mpd
        - mpd-mpris

  - type: script
    scripts:
      - finalize-boot.sh

  - type: script
    secrets:
      - type: env
        name: NTFY_TOPIC
        mount:
          type: env
          name: NTFY_TOPIC
    snippets:
      - 'curl -s -d "Exporting layers..." -H "Title: Layer Complete" -H "Tags: hourglass" "ntfy.sh/$NTFY_TOPIC" || true'
